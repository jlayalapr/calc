<style>
/* Ai Glow — Design tokens
   Editorial skincare: cream/sand base, botanical green, Fraunces serif.
*/

:root {
  /* Palette — light (crema/arena) */
  --bg:            #f7f2ea;
  --bg-elevated:   #fbf7f0;
  --bg-sunken:     #efe6d8;
  --surface:       #ffffff;
  --ink:           #1a1a17;
  --ink-2:         #4a443c;
  --ink-3:         #8a8074;
  --ink-4:         #b8ad9d;
  --line:          rgba(26, 26, 23, 0.08);
  --line-strong:   rgba(26, 26, 23, 0.16);

  --accent:        #4a6b4a;   /* botanical green */
  --accent-ink:    #ffffff;
  --accent-soft:   #e6ece0;
  --accent-2:      #2d4a2d;

  --warn:          #c07556;   /* terracotta for alerts */
  --warn-soft:     #f3e2d6;

  /* Type */
  --font-serif:  'Fraunces', 'Times New Roman', serif;
  --font-sans:   'Inter Tight', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono:   'JetBrains Mono', ui-monospace, monospace;

  /* Radius */
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --r-xl: 32px;

  /* Shadow — soft, paper-like */
  --shadow-1: 0 1px 2px rgba(26,18,6,0.04), 0 2px 6px rgba(26,18,6,0.04);
  --shadow-2: 0 2px 6px rgba(26,18,6,0.05), 0 12px 30px rgba(26,18,6,0.06);
}

/* Dark — grafito */
[data-theme="dark"] {
  --bg:            #161513;
  --bg-elevated:   #1e1c19;
  --bg-sunken:     #0f0e0c;
  --surface:       #25221e;
  --ink:           #f5efe4;
  --ink-2:         #cfc6b6;
  --ink-3:         #9a9081;
  --ink-4:         #5f584c;
  --line:          rgba(245, 239, 228, 0.10);
  --line-strong:   rgba(245, 239, 228, 0.18);

  --accent:        #8aa880;
  --accent-ink:    #141611;
  --accent-soft:   #2a332a;
  --accent-2:      #b5ccad;

  --warn:          #d98a6a;
  --warn-soft:     #3a2820;

  --shadow-1: 0 1px 2px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.3);
  --shadow-2: 0 2px 6px rgba(0,0,0,0.45), 0 12px 30px rgba(0,0,0,0.35);
}

/* Base */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'cv11';
}

.serif { font-family: var(--font-serif); font-weight: 400; letter-spacing: -0.01em; }
.eyebrow {
  font-family: var(--font-sans);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
}

/* Scrollbars — hide inside device */
.noscroll::-webkit-scrollbar { display: none; }
.noscroll { scrollbar-width: none; }

</style>

<style>
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 20% -10%, #efe6d8 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #e6ece0 0%, transparent 55%),
      #f2ece1;
    min-height: 100vh;
    overflow-x: hidden;
  }
  [data-theme="dark"] body, body[data-theme="dark"] {
    background:
      radial-gradient(1200px 600px at 20% -10%, #201d19 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #1a1e19 0%, transparent 55%),
      #0e0d0b;
  }

  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 60px;
    position: relative;
  }

  /* Header / brandmark above the phone */
  .brand {
    position: absolute; top: 28px; left: 32px;
    display: flex; align-items: center; gap: 10px;
  }
  .brand .mark {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent);
    display: grid; place-items: center; color: #fff;
    font-family: var(--font-serif); font-size: 18px; line-height: 1;
  }
  .brand .name {
    font-family: var(--font-serif); font-size: 22px; letter-spacing: -0.01em;
    color: var(--ink);
  }
  .brand .subtitle {
    font-size: 11px; color: var(--ink-3); letter-spacing: 0.12em; text-transform: uppercase;
    margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--line-strong);
  }

  /* Bottom caption / prototype hint */
  .hint {
    position: absolute; bottom: 28px; left: 32px; right: 32px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--ink-3); letter-spacing: 0.05em;
  }
  .hint a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--line-strong); }

  /* Tweaks panel */
  .tweaks {
    position: fixed; right: 20px; bottom: 20px; z-index: 100;
    width: 280px; padding: 18px 18px 16px; border-radius: 22px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); box-shadow: var(--shadow-2);
    font-family: var(--font-sans); display: none;
  }
  .tweaks.on { display: block; }
  .tweaks h3 {
    font-family: var(--font-serif); font-weight: 500; font-size: 17px;
    margin: 0 0 14px;
  }
  .tweaks .row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .tweaks label {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 500;
  }
  .seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
    background: var(--bg-sunken); border-radius: 10px; padding: 3px;
  }
  .seg button {
    border: none; background: transparent; padding: 7px 6px; border-radius: 8px;
    font-family: inherit; font-size: 12px; color: var(--ink-2);
    cursor: pointer; white-space: nowrap;
  }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

  /* side nav — floating "frames" list for jumping screens directly */
  .framenav {
    position: fixed; left: 20px; top: 80px; z-index: 50;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 8px; box-shadow: var(--shadow-1);
    font-family: var(--font-sans);
  }
  .framenav button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 12px; border: none; background: transparent;
    color: var(--ink-2); font-family: inherit; font-size: 12px;
    border-radius: 10px; cursor: pointer; text-align: left;
  }
  .framenav button.on { background: var(--bg-sunken); color: var(--ink); font-weight: 500; }
  .framenav .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--ink-4); }
  .framenav button.on .dot { background: var(--accent); }
</style>

/* Phone — our own editorial bezel.
   Ignoring the iOS frame starter component since we want a cleaner, almost
   paper-like bezel that doesn't scream "iOS". Single rounded rect, dynamic
   island, home indicator.
*/

function Phone({ children, width = 392, height = 840, dark = false }) {
  return (
    <div style={{
      width, height, borderRadius: 52, overflow: 'hidden',
      position: 'relative',
      background: dark ? '#161513' : '#f7f2ea',
      boxShadow: '0 40px 80px rgba(26,18,6,0.12), 0 0 0 10px ' + (dark ? '#0b0a09' : '#eae3d3') + ', 0 0 0 11px rgba(26,18,6,0.12)',
    }}>
      {/* Dynamic island */}
      <div style={{
        position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)',
        width: 118, height: 34, borderRadius: 24, background: '#0b0a09', zIndex: 50,
      }}/>
      <div style={{ position: 'relative', height: '100%', width: '100%', overflow: 'hidden' }}>
        {children}
      </div>
      {/* Home indicator */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, height: 24, zIndex: 60,
        display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 7, pointerEvents: 'none',
      }}>
        <div style={{
          width: 126, height: 4, borderRadius: 100,
          background: dark ? 'rgba(245,239,228,0.65)' : 'rgba(26,26,23,0.3)',
        }}/>
      </div>
    </div>
  );
}

Object.assign(window, { Phone });

</script>

function TabBar({ active, onNav, dark }) {
  const bg = dark ? 'rgba(37,34,30,0.9)' : 'rgba(255,255,255,0.85)';
  const items = [
    { key: 'home',    label: 'Today',   icon: Icon.home },
    { key: 'shelf',   label: 'Shelf',   icon: Icon.shelf },
    { key: 'scan',    label: 'Scan',    icon: Icon.scan, primary: true },
    { key: 'routine', label: 'Routine', icon: Icon.routine },
    { key: 'profile', label: 'You',     icon: Icon.profile },
  ];
  return (
    <div style={{
      position: 'absolute', left: 12, right: 12, bottom: 12, zIndex: 30,
      background: bg, borderRadius: 28, padding: '10px 8px',
      backdropFilter: 'blur(24px) saturate(160%)', WebkitBackdropFilter: 'blur(24px) saturate(160%)',
      boxShadow: 'var(--shadow-2)',
      border: '1px solid var(--line)',
      display: 'flex', alignItems: 'center', justifyContent: 'space-around',
    }}>
      {items.map(it => {
        const isActive = it.key === active;
        if (it.primary) {
          return (
            <button key={it.key} onClick={() => onNav(it.key)} style={{
              width: 52, height: 52, borderRadius: 26, border: 'none',
              background: 'var(--accent)', color: 'var(--accent-ink)',
              display: 'grid', placeItems: 'center', cursor: 'pointer',
              boxShadow: '0 8px 20px rgba(74, 107, 74, 0.35)',
              transform: 'translateY(-6px)',
            }}>{it.icon('currentColor')}</button>
          );
        }
        return (
          <button key={it.key} onClick={() => onNav(it.key)} style={{
            flex: 1, background: 'transparent', border: 'none', cursor: 'pointer',
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2,
            padding: '6px 0',
            color: isActive ? 'var(--ink)' : 'var(--ink-3)',

            {it.icon('currentColor')}
            <span style={{ fontSize: 10, fontWeight: 500, letterSpacing: 0.2 }}>{it.label}</span>

function Ring({ value, label, size = 78, stroke = 6, color = 'var(--accent)' }) {
  const r = (size - stroke) / 2;
  const C = 2 * Math.PI * r;
  const off = C - (C * value) / 100;
  return (
    <div style={{ width: size, textAlign: 'center' }}>
      <svg width={size} height={size} style={{ display: 'block' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke="var(--line-strong)" strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={C} strokeDashoffset={off} strokeLinecap="round"
          transform={`rotate(-90 ${size/2} ${size/2})`} />
        <text x="50%" y="52%" dominantBaseline="middle" textAnchor="middle"
          style={{ fontFamily: 'var(--font-serif)', fontSize: size * 0.32, fill: 'var(--ink)' }}>
          {value}
        </text>
      </svg>
      <div className="eyebrow" style={{ marginTop: 6 }}>{label}</div>
    </div>
  );
}

      return next;

  const amSteps = [
    { t: 'Cleanse',     p: 'Byoma Creamy Jelly',         d: '30s, lukewarm water' },

              width: 28, height: 28, borderRadius: 14, flexShrink: 0, marginLeft: 8, padding: 0,

              <div style={{ fontSize: 12, color: 'var(--ink-3)', marginTop: 2 }}>{ing.r}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function Onboarding({ onDone }) {
  const [step, setStep] = React.useState(0);
  const questions = [
    {
      title: 'How does your skin usually feel by midday?',
      opts: ['Tight and a bit dry', 'Balanced, comfortable', 'Shiny in the T-zone', 'Very oily all over'],
    },
    {
      title: 'What are you most hoping to improve?',
      opts: ['Hydration', 'Breakouts', 'Fine lines', 'Even tone', 'Redness'],
    },
    {
      title: 'How many products are in your current routine?',
      opts: ['1–2, I keep it simple', '3–5, a solid routine', '6+, I love a ritual'],
    },
  ];
  const total = questions.length + 1;
  const q = questions[step];

  if (step === questions.length) {
    return (
      <div style={{ padding: '40px 28px', minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
        <div className="eyebrow">Step {total}/{total}</div>
        <div className="serif" style={{ fontSize: 34, lineHeight: 1.05, marginTop: 12, letterSpacing: -0.4 }}>
          Let's look at you.
        </div>
        <div style={{ fontSize: 15, color: 'var(--ink-2)', lineHeight: 1.5, marginTop: 12 }}>
          A quick selfie in natural light. We analyze hydration, barrier and tone — the photo never leaves your device.
        </div>

        <div style={{
          marginTop: 30, aspectRatio: '3/4', borderRadius: 28,
          background: 'linear-gradient(160deg, #e6ece0, #f7f2ea)',
          position: 'relative', overflow: 'hidden',
          border: '1px solid var(--line)',
        }}>
          <div style={{
            position: 'absolute', inset: 40, borderRadius: '50%',
            border: '1.5px dashed var(--accent)',
          }}/>
          <div style={{
            position: 'absolute', left: 0, right: 0, bottom: 18, textAlign: 'center',
            fontSize: 12, color: 'var(--ink-3)',
          }}>Align your face inside the oval</div>
        </div>

        <div style={{ marginTop: 'auto', paddingTop: 30 }}>
          <button onClick={onDone} style={{
            width: '100%', padding: '16px', borderRadius: 18, border: 'none',
            background: 'var(--accent)', color: '#fff', fontSize: 16, fontWeight: 500,
            fontFamily: 'inherit', cursor: 'pointer',
          }}>Take the photo</button>
          <button onClick={onDone} style={{
            width: '100%', padding: '12px', borderRadius: 18, border: 'none',
            background: 'transparent', color: 'var(--ink-2)', fontSize: 14,
            fontFamily: 'inherit', cursor: 'pointer', marginTop: 6,
          }}>Skip for now</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ padding: '40px 28px', minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <div className="eyebrow">Step {step + 1}/{total}</div>
      <div className="serif" style={{ fontSize: 30, lineHeight: 1.1, marginTop: 12, letterSpacing: -0.3 }}>
        {q.title}
      </div>

      <div style={{ marginTop: 30, display: 'grid', gap: 10 }}>
        {q.opts.map((o, i) => (
          <button key={i} onClick={() => setStep(step + 1)} style={{
            textAlign: 'left', padding: '16px 18px', borderRadius: 16,
            background: 'var(--surface)', border: '1px solid var(--line)',
            color: 'var(--ink)', fontSize: 15, fontFamily: 'inherit', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          }}>
            <span>{o}</span>
            {Icon.chevron('var(--ink-3)')}
          </button>
        ))}
      </div>

      <div style={{ marginTop: 'auto', display: 'flex', gap: 4, paddingTop: 30 }}>
        {Array.from({ length: total }).map((_, i) => (
          <div key={i} style={{
            flex: 1, height: 3, borderRadius: 2,
            background: i <= step ? 'var(--accent)' : 'var(--line-strong)',
          }}/>
        ))}
      </div>
    </div>
  );
}

// ───────────── Scan flow ─────────────

function ScanFlow({ onDone }) {
  const [stage, setStage] = React.useState('scan'); // scan → analyzing → result
  React.useEffect(() => {
    if (stage === 'scan') { const t = setTimeout(() => setStage('analyzing'), 1800); return () => clearTimeout(t); }
    if (stage === 'analyzing') { const t = setTimeout(() => setStage('result'), 2000); return () => clearTimeout(t); }
  }, [stage]);

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 40,
      background: stage === 'result' ? 'var(--bg)' : '#0b0b0a',
      color: stage === 'result' ? 'var(--ink)' : '#fff',
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
    }}>
      {/* Close */}
      <button onClick={onDone} style={{
        position: 'absolute', top: 58, right: 18, zIndex: 50,
        width: 38, height: 38, borderRadius: 19, border: 'none',
        background: stage === 'result' ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.15)',
        color: stage === 'result' ? '#1a1a17' : '#fff',
        display: 'grid', placeItems: 'center', cursor: 'pointer',
        backdropFilter: 'blur(10px)',
      }}>{Icon.close('currentColor')}</button>

      {stage !== 'result' && (
        <>
          {/* Camera viewfinder — photo of a bottle */}
          <div style={{
            position: 'absolute', inset: 0,
            backgroundImage: 'url(https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=900&q=70)',
            backgroundSize: 'cover', backgroundPosition: 'center',
            filter: 'brightness(0.8)',
          }}/>
          <div style={{ position: 'absolute', inset: 0, background: 'rgba(8,8,8,0.25)' }}/>

          {/* Corner brackets */}
          <div style={{ position: 'absolute', inset: 110, borderRadius: 18 }}>
            {['tl','tr','bl','br'].map(c => {
              const s = {
                position: 'absolute', width: 36, height: 36,
                borderColor: '#fff', borderStyle: 'solid', borderWidth: 0,
              };
              if (c === 'tl') Object.assign(s, { top: -2, left: -2, borderTopWidth: 3, borderLeftWidth: 3, borderRadius: '18px 0 0 0' });
              if (c === 'tr') Object.assign(s, { top: -2, right: -2, borderTopWidth: 3, borderRightWidth: 3, borderRadius: '0 18px 0 0' });
              if (c === 'bl') Object.assign(s, { bottom: -2, left: -2, borderBottomWidth: 3, borderLeftWidth: 3, borderRadius: '0 0 0 18px' });
              if (c === 'br') Object.assign(s, { bottom: -2, right: -2, borderBottomWidth: 3, borderRightWidth: 3, borderRadius: '0 0 18px 0' });
              return <div key={c} style={s}/>;
            })}
            {stage === 'scan' && (
              <div className="scanline" style={{
                position: 'absolute', left: 0, right: 0,
                height: 2, background: 'linear-gradient(90deg, transparent, #8aa880, transparent)',
                boxShadow: '0 0 18px #8aa880',
                animation: 'scan 1.6s linear infinite',
              }}/>
            )}
          </div>

          {/* Bottom copy */}
          <div style={{
            position: 'absolute', left: 0, right: 0, bottom: 40,
            textAlign: 'center', padding: '0 40px',
          }}>
            {stage === 'scan' && (
              <>
                <div className="eyebrow" style={{ color: 'rgba(255,255,255,0.7)' }}>Align the label</div>
                <div className="serif" style={{ fontSize: 22, marginTop: 10, color: '#fff' }}>
                  Reading the product…
                </div>
              </>
            )}
            {stage === 'analyzing' && (
              <>
                <div className="eyebrow" style={{ color: 'rgba(255,255,255,0.7)' }}>Matching to you</div>
                <div className="serif" style={{ fontSize: 22, marginTop: 10, color: '#fff' }}>
                  Cross-referencing 36 ingredients…
                </div>
                <div style={{
                  marginTop: 16, height: 3, borderRadius: 2,
                  background: 'rgba(255,255,255,0.15)', overflow: 'hidden',
                }}>
                  <div style={{
                    height: '100%', background: '#8aa880', borderRadius: 2,
                    animation: 'grow 2s ease-out forwards',
                  }}/>
                </div>
              </>
            )}
          </div>

          <style>{`
            @keyframes scan { 0% { top: 0 } 50% { top: calc(100% - 2px) } 100% { top: 0 } }
            @keyframes grow { from { width: 0 } to { width: 100% } }
          `}</style>
        </>
      )}

      {stage === 'result' && (
        <div style={{ paddingTop: 80, paddingBottom: 40, overflow: 'auto', flex: 1 }}>
          <div style={{ padding: '0 22px' }}>
            <div className="eyebrow" style={{ color: 'var(--accent)' }}>Match found</div>
            <div className="serif" style={{ fontSize: 30, marginTop: 8, lineHeight: 1.1 }}>
              Byoma Creamy<br/>Jelly Cleanser
            </div>
          </div>

          <div style={{
            margin: '22px 22px 0', borderRadius: 22, overflow: 'hidden',
            aspectRatio: '5/3', background: 'url(https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=700&q=70) center/cover',
          }}/>

          <div style={{
            margin: '18px 22px 0', padding: '20px 22px',
            background: 'var(--accent-soft)', borderRadius: 20,
            border: '1px solid rgba(74,107,74,0.18)',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{ color: 'var(--accent-2)' }}>{Icon.sparkle('currentColor', 14)}</span>
              <span className="eyebrow" style={{ color: 'var(--accent-2)' }}>90% fit for your skin</span>
            </div>
            <div className="serif" style={{ fontSize: 19, lineHeight: 1.3, marginTop: 10, color: 'var(--accent-2)' }}>
              Gentle enough for your current barrier state. Slots cleanly as your AM and PM cleanser.
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, padding: '18px 22px' }}>
            {[
              { k: 'pH',          v: '5.5' },
              { k: 'Fragrance',   v: 'Low' },
              { k: 'Alcohol',     v: 'None' },
              { k: 'Actives',     v: '0' },
            ].map((s, i) => (
              <div key={i} style={{
                background: 'var(--surface)', border: '1px solid var(--line)',
                borderRadius: 14, padding: '12px 14px',
              }}>
                <div className="eyebrow">{s.k}</div>
                <div className="serif" style={{ fontSize: 22, marginTop: 4 }}>{s.v}</div>
              </div>
            ))}
          </div>

          <div style={{ padding: '8px 22px 0' }}>
            <button onClick={onDone} style={{
              width: '100%', padding: '16px', borderRadius: 18, border: 'none',
              background: 'var(--accent)', color: '#fff', fontSize: 15, fontWeight: 500,
              fontFamily: 'inherit', cursor: 'pointer',
              display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
            }}>
              {Icon.plus('#fff', 16)} Add to my shelf
            </button>
            <button onClick={onDone} style={{
              width: '100%', padding: '14px', borderRadius: 18, border: 'none',
              background: 'transparent', color: 'var(--ink-2)', fontSize: 14,
              fontFamily: 'inherit', cursor: 'pointer', marginTop: 4,
            }}>Not interested</button>
          </div>
        </div>
      )}
    </div>
  );
}

Object.assign(window, {
  Dashboard, Shelf, Routine, Profile, ProductDetail, Onboarding, ScanFlow,
  StatusBar, TabBar, PERSONAS, PRODUCTS, Icon,
});

</script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "dark",
      "persona": "mature"
    }/*EDITMODE-END*/;

    const STORAGE_KEY = 'aiglow-state-v1';

    function App() {
      const [state, setState] = React.useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          return { ...TWEAK_DEFAULTS, ...saved };
        } catch { return TWEAK_DEFAULTS; }
      });
      const [screen, setScreen] = React.useState(() => {
        return localStorage.getItem('aiglow-screen') || 'home';
      });
      const [openProduct, setOpenProduct] = React.useState(null);
      const [scanOpen, setScanOpen] = React.useState(false);
      const [showOnboarding, setShowOnboarding] = React.useState(false);
      const [tweakOn, setTweakOn] = React.useState(false);

      const dark = state.theme === 'dark';

      // Persist
      React.useEffect(() => {
        document.documentElement.dataset.theme = state.theme;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }, [state]);
      React.useEffect(() => { localStorage.setItem('aiglow-screen', screen); }, [screen]);

      // Tweaks host protocol
      React.useEffect(() => {
        function onMsg(e) {
          const d = e.data || {};
          if (d.type === '__activate_edit_mode') setTweakOn(true);
          else if (d.type === '__deactivate_edit_mode') setTweakOn(false);
        }
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const setKey = (k, v) => {
        setState(s => {
          const next = { ...s, [k]: v };
          try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*'); } catch {}
          return next;
        });
      };

      const onNav = (key) => {
        if (key === 'scan') { setScanOpen(true); return; }
        setScreen(key);
      };

      let body;
      if (showOnboarding) {
        body = <Onboarding onDone={() => setShowOnboarding(false)} />;
      } else if (screen === 'home')    body = <Dashboard persona={state.persona} onScan={() => setScanOpen(true)} onOpenProduct={setOpenProduct} onOpenProfile={() => setScreen('profile')} />;
      else if (screen === 'shelf')     body = <Shelf onOpenProduct={setOpenProduct} />;
      else if (screen === 'routine')   body = <Routine persona={state.persona} />;
      else if (screen === 'profile')   body = <Profile persona={state.persona} setPersona={(p) => setKey('persona', p)} />;

      const frames = [
        { k: 'home',    label: 'Today' },
        { k: 'shelf',   label: 'My Shelf' },
        { k: 'routine', label: 'Routine' },
        { k: 'profile', label: 'Profile' },
        { k: 'onboard', label: 'Onboarding' },
        { k: 'scan',    label: 'Scan flow' },
      ];

      return (
        <>
          <div className="brand">
            <div className="mark serif">g</div>
            <div className="name">Ai Glow</div>
            <div className="subtitle">Skincare Companion · Prototype</div>
          </div>

          <div className="framenav">
            {frames.map(f => (
              <button key={f.k} className={(f.k === 'onboard' ? showOnboarding : f.k === 'scan' ? scanOpen : (!showOnboarding && !scanOpen && screen === f.k)) ? 'on' : ''}
                      onClick={() => {
                        if (f.k === 'onboard') { setShowOnboarding(true); setScanOpen(false); return; }
                        if (f.k === 'scan') { setScanOpen(true); setShowOnboarding(false); return; }
                        setShowOnboarding(false); setScanOpen(false); setScreen(f.k);
                      }}>
                <span className="dot"/> {f.label}
              </button>
            ))}
          </div>

          <Phone dark={dark}>
            <div style={{ position: 'absolute', inset: 0, overflowY: 'auto', overflowX: 'hidden' }} className="noscroll">
              <div style={{ height: 54 }} />
              {body}
            </div>
            <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 25, pointerEvents: 'none' }}>
              <StatusBar dark={dark} />
            </div>
            {!showOnboarding && !openProduct && !scanOpen && (
              <TabBar active={screen} onNav={onNav} dark={dark} />
            )}
            {openProduct && (
              <div style={{ position: 'absolute', inset: 0, zIndex: 35, background: 'var(--bg)', overflow: 'auto' }} className="noscroll">
                <ProductDetail product={openProduct} onClose={() => setOpenProduct(null)} />
              </div>
            )}
            {scanOpen && <ScanFlow onDone={() => setScanOpen(false)} />}
          </Phone>

          <div className="hint">
            <div>Tap the Scan tab to try the camera flow · Tap a shelf item to see product detail</div>
            <div>Light · {state.persona}</div>
          </div>

          <div className={'tweaks ' + (tweakOn ? 'on' : '')}>
            <h3>Tweaks</h3>
            <div className="row">
              <label>Theme</label>
              <div className="seg">
                <button className={state.theme === 'light' ? 'on' : ''} onClick={() => setKey('theme', 'light')}>Light</button>
                <button className={state.theme === 'dark' ? 'on' : ''} onClick={() => setKey('theme', 'dark')}>Dark</button>
              </div>
            </div>
            <div className="row">
              <label>Skin-type persona</label>
              <div className="seg">
                {Object.keys(PERSONAS).map(p => (
                  <button key={p} className={state.persona === p ? 'on' : ''} onClick={() => setKey('persona', p)}>
                    {p[0].toUpperCase() + p.slice(1)}
                  </button>
                ))}
              </div>
            </div>
            <div style={{ fontSize: 11, color: 'var(--ink-3)', lineHeight: 1.5, marginTop: 6 }}>
              Persona switches change the AI copy, skin metrics, and routine recommendations in real time.
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
